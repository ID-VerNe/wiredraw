# SDK / 签名构建常量的唯一来源（issue #205）。
#
# 使用者是两个独立编译链，读同一份：
#   - tools/android-mtp-probe/build.sh            手搓 aapt2 / javac / d8 / apksigner
#   - tools/android-mtp-import/                    Gradle + AGP（build.gradle.kts）
# 改这里一处，两边同时生效；不要再往那两个构建文件里加副本。
#
# 格式：UTF-8 明文，一行一条 `key=value`，`#` 开头为注释，值不含空格与引号。
# 两边的解析口径刻意一致，且都**不用** java.util.Properties（它按 ISO-8859-1 解码并带
# 转义语义，和 shell 的 `source` 读法对不上，同一份值会解释成两个结果）：
#   - shell：build.sh 里 `tr -d '\r'` 去 CR 后 `source`，键名即变量名；
#   - Gradle：tools/android-mtp-import/gradle/build-constants.gradle.kts 逐行读 UTF-8，
#     结果放 extra["buildConstants"]。
#
# 本文件必须保持 LF（.gitattributes 按路径钉了 eol=lf，别改）：CRLF 会让 shell 读到的
# 口令尾部多一个 \r，签名与验签就会对不上，而报错只会说「口令错误」。

# platforms/ 目录号，同时就是 compileSdk：探针拼成 platforms/android-<N>，
# Gradle 直接用作 compileSdk（AGP 据此选 android.jar）。
platformApi=35

# 探针 build-tools 目录号（aapt2 / d8 / zipalign / apksigner 都从这里取）。
# 只有探针读它：Gradle 侧由 AGP 自选 build-tools 版本，不受这里影响。
buildToolsVersion=35.0.1

# 最低 / 目标 API：探针是 aapt2 link 的 --min-sdk-version / --target-sdk-version
# 与 d8 的 --min-api，Gradle 侧是 minSdk / targetSdk。
minSdk=31
targetSdk=35

# 调试签名。keystoreFile 是**文件名**：探针在工程根目录用它（AGENTS.md §4 的红线：
# 密钥必须与构建目录分离），Gradle 把它拼到 ../android-mtp-probe/ 下。
# 口令是公开的调试口令（AOSP 通用值，见 docs/safety-and-privacy.md 第三节），
# 不是真实凭据；不得换成生产密钥。
keystoreFile=rea-debug.keystore
keystoreAlias=rea
keystorePassword=android
